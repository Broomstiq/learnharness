name: macOS Intel (x64) build

# Fork-only: unsigned, unnotarized Intel Mac build. Manual runs only; nothing
# is published. Native binaries are traced per-arch, so this must run on an
# Intel runner (no cross-build). macos-15-intel is used instead of macos-26
# because no Intel macOS 26 runner exists; the Icon Composer asset (needs
# macOS 26 actool) is therefore replaced by the prebuilt build/icon.icns.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  package:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      # Electron 44+ requires macOS 13; 43 is the last line that runs on macOS 12.
      - name: Pin Electron 43 (macOS 12 support)
        run: npm install --no-save --no-audit --no-fund electron@43.8.3
      - name: Native renderer tests on this OS
        run: npx electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
      - run: npm run build
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
      - name: Package unsigned x64 app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --x64 --publish never -c.mac.notarize=false -c.mac.icon=build/icon.icns
      - name: Initialize packaged providers offline
        run: |
          app="dist/mac/LearnHarness.app/Contents"
          payload="$app/Resources/server/standalone"
          node scripts/smoke-provider-runtime.mjs --standalone "$payload"
          node scripts/smoke-provider-runtime.mjs --standalone "$payload" --runtime "$app/MacOS/LearnHarness"
      - name: Exercise packaged demo runtime
        run: |
          app="dist/mac/LearnHarness.app/Contents"
          node scripts/smoke-demo-runtime.mjs --standalone "$app/Resources/server/standalone" --runtime "$app/MacOS/LearnHarness" --browser
      - uses: actions/upload-artifact@v7
        with:
          name: learnharness-mac-x64
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
